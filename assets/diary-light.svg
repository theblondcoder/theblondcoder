<svg xmlns="http://www.w3.org/2000/svg" width="960" height="587" viewBox="0 0 960 587" role="img" aria-labelledby="title desc">
  <title id="title">TRAINING DIARY: ANDROID / IN DEVELOPMENT. THE CHALLENGE: Keep a consistent record of workouts and progress without a complicated fitness platform. THE BUILD: A native Android app in Kotlin, with Room for locally stored workout records. THE OUTCOME SO FAR: A focused workout-tracking foundation. Still in development: cloud data, caching, notifications and further improvements are in progress or planned.</title>
  <desc id="desc">TRAINING DIARY: ANDROID / IN DEVELOPMENT. THE CHALLENGE: Keep a consistent record of workouts and progress without a complicated fitness platform. THE BUILD: A native Android app in Kotlin, with Room for locally stored workout records. THE OUTCOME SO FAR: A focused workout-tracking foundation. Still in development: cloud data, caching, notifications and further improvements are in progress or planned.. Original engineering-console artwork for theblondcoder.</desc>
  <style>
    text{font-family:Consolas,"Liberation Mono",monospace;letter-spacing:0}
    .fg{fill:#17241c}.muted{fill:#526657}.lime{fill:#416718}.pink{fill:#b52b5e}.cyan{fill:#126773}
    .panel{fill:#edf3eb;stroke:#c1d0c0}.wire{fill:none;stroke:#c1d0c0;stroke-width:2}
    .signal{fill:none;stroke:#416718;stroke-width:2;stroke-dasharray:5 12;animation:flow 5s linear infinite}
    .cursor{animation:blink 1.6s steps(2,end) infinite}.pulse{animation:pulse 3s ease-in-out infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 1s ease-out both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes flow{to{stroke-dashoffset:-68}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){.signal,.cursor,.pulse,.bar,.scan{animation:none}}
  </style>
