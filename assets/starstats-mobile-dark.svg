 stroke-linecap="round" stroke-linejoin="round"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"/><rect x="14" y="2" width="8" height="8" rx="1"/></g><text x="78" y="457" font-size="15" class="cyan" font-weight="700">THE BUILD</text><text x="38" y="495" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">React interface, Express/TypeScript</text><text x="38" y="524" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">API, PHP scraping and MySQL/MariaDB.</text><text x="38" y="553" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">Retired athletes use the database;</text><text x="38" y="582" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">active athletes use Wikipedia</text><text x="38" y="611" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">scraping.</text><path d="M20 646H460" class="wire" /><rect x="20" y="671" width="3" height="157" class="lime"/><g transform="translate(38,675)" fill="none" stroke="#c6f879" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="78" y="693" font-size="15" class="lime" font-weight="700">THE OUTCOME</text><text x="38" y="731" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">Player search, athlete cards and</text><text x="38" y="760" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">competition-based comparisons, with</text><text x="38" y="789" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">the data source adapted to each</text><text x="38" y="818" font-size="20" class="fg" style="font-family:Segoe UI,Arial,sans-serif">athlete&apos;s status.</text>
</svg>
