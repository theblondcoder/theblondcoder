<svg xmlns="http://www.w3.org/2000/svg" width="480" height="807" viewBox="0 0 480 807" role="img" aria-labelledby="title desc">
  <title id="title">SMART FIRE DETECTION: EMBEDDED / MONITORING. THE CHALLENGE: Bring sensor readings and potential fire alerts into one monitoring interface. THE BUILD: An ESP32 sensing prototype paired with a Node.js/Express web dashboard for monitoring and alerts. THE OUTCOME: Embedded sensing meets web monitoring in a working learning prototype, not a certified safety system. Access details stay private.</title>
  <desc id="desc">SMART FIRE DETECTION: EMBEDDED / MONITORING. THE CHALLENGE: Bring sensor readings and potential fire alerts into one monitoring interface. THE BUILD: An ESP32 sensing prototype paired with a Node.js/Express web dashboard for monitoring and alerts. THE OUTCOME: Embedded sensing meets web monitoring in a working learning prototype, not a certified safety system. Access details stay private.. Original engineering-console artwork for theblondcoder.</desc>
  <style>
    text{font-family:Consolas,"Liberation Mono",monospace;letter-spacing:0}
    .fg{fill:#eff7ee}.muted{fill:#a3b3a6}.lime{fill:#c6f879}.pink{fill:#ff80ab}.cyan{fill:#7cdee3}
    .panel{fill:#171d18;stroke:#354438}.wire{fill:none;stroke:#354438;stroke-width:2}
    .signal{fill:none;stroke:#c6f879;stroke-width:2;stroke-dasharray:5 12;animation:flow 5s linear infinite}
    .cursor{animation:blink 1.6s steps(2,end) infinite}.pulse{animation:pulse 3s ease-in-out infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 1s ease-out both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes flow{to{stroke-dashoffset:-68}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){.signal,.cursor,.pulse,.bar,.scan{animation:none}}
  </style>
