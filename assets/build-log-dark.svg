<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 218" role="img" aria-labelledby="title desc">
  <title id="title">Build Log by Iván Baltanás</title>
  <desc id="desc">A developer profile focused on web, apps, and systems.</desc>
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 896px 107px; }
    .trace { animation: trace 5s linear infinite; stroke-dasharray: 5 9; }
    @keyframes pulse { 50% { opacity: .42; transform: scale(.84); } }
    @keyframes trace { to { stroke-dashoffset: -56; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .trace { animation: none; } }
  </style>
