  <text x="30" y="135" fill="#aabbb0" font-family="Consolas,monospace" font-size="19">Web development <tspan fill="#63f58d">·</tspan> Apps <tspan fill="#ff6394">·</tspan> Systems</text>
  <text x="30" y="161" fill="#83968a" font-family="Consolas,monospace" font-size="12">BUILD / LEARN / IMPROVE</text>
